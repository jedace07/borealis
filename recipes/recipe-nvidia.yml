---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: borealis-nvidia
# description will be included in the image's metadata
description: This is my personal OS image, for Nvidia.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-cosmic-nvidia-open
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
      copr:
        - atim/starship
    install:
      packages:
        - repo: brave-browser
          packages:
            - brave-origin
        - micro
        - starship
        - liberation-fonts
        - kde-connect
        - clinfo
        - pocl
        - mesa-libOpenCL
        - intel-compute-runtime
        - glycin-thumbnailer
        - vulkan-tools
        - OpenCL-ICD-Loader
    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)
        - cosmic-store
        - cosmic-player
        - cosmic-edit
        - qt6ct
        - ark
        - ocl-icd
        - cosmic-monitor

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.gnome.Loupe
          - io.github.diegopvlk.Cine
          - eu.betterbird.Betterbird
          - org.gnome.TextEditor
          - io.github.kolunmi.Bazaar
          - io.github.flattool.Warehouse
          - com.github.tchx84.Flatseal
          - app.devsuite.Ptyxis
          - com.ranfdev.DistroShelf
          - io.missioncenter.MissionCenter

  - type: brew
    auto-update: true
    auto-upgrade: true
    brew-analytics: true

  - type: fonts
    fonts:
      google-fonts:
        # Metric-compatible MS replacements
        - Carlito      # Drop-in replacement for Calibri (MS Word default)
        - Caladea      # Drop-in replacement for Cambria
        - Arimo        # Drop-in replacement for Arial
        - Tinos        # Drop-in replacement for Times New Roman
        - Cousine      # Drop-in replacement for Courier New
        - Selawik      # Metric-compatible replacement for Segoe UI

        # Modern UI & Web Essentials
        - Inter        # Clean modern UI sans-serif
        - Roboto       # Default Android sans-serif
        - Open Sans    # Web & interface standard
        - Lato         # Popular sans-serif alternative
        - Montserrat   # Geometric sans for headings
        - Nunito       # Rounded display sans

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
